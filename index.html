<!doctype html>
<html lang="pt-BR" data-text-scale="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E aí, Bora Aprender AWS? — Jogo de Estudos SAA-C03</title>
<link rel="stylesheet" href="assets/css/variaveis.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/css/telas.css">
<link rel="stylesheet" href="assets/css/animacoes.css">
</head>
<body>

<div class="sr-only" id="ariaAnnounce" aria-live="polite"></div>

<div class="wrap">
  <header>
    <div class="topRow">
      <button class="homeBtn" id="home" data-action="intro" title="Voltar ao início [Esc]" aria-label="Voltar ao início" hidden>← início</button>
      <div class="logo">
        E aí, Bora Aprender AWS?
        <small>protótipo · por 人間/人间 (nin-guem) · livre (AGPL + CC-BY-SA)</small>
      </div>
      <div class="ctrlGroup">
        <button class="iconBtn" id="btnFontMinus" data-action="font-minus" title="Diminuir fonte [A-]" aria-label="Diminuir texto">A-</button>
        <button class="iconBtn" id="btnFontPlus" data-action="font-plus" title="Aumentar fonte [A+]" aria-label="Aumentar texto">A+</button>
        <button class="iconBtn" id="btnTheme" data-action="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">☀️</button>
        <button class="iconBtn" id="btnAudio" data-action="audio" title="Alternar som ligado/desligado" aria-label="Alternar som">🔊</button>
      </div>
    </div>
    <div class="statusBar">
      <div class="bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <div class="xp" id="xp">0 XP</div>
    </div>
  </header>

  <main class="card" id="app" tabIndex="-1"></main>

  <footer class="foot">do zero à aprovação · você é a Júlia 👩🏽‍💻</footer>
</div>

<script src="src/jogo.js"></script>
<script src="data/bank.js"></script>
<script src="src/persistencia.js"></script>
<script src="src/audio.js"></script>
<script src="src/acessibilidade.js"></script>
<script src="src/renderizador.js"></script>
<script src="src/teclado.js"></script>
<script src="src/app.js"></script>
</body>
</html>
