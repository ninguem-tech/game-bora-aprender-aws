<!--
  Ícones da aba e apple-touch: derivados leves (PNG de verdade) da assinatura em assets/.
  Obs.: os originais nin-guem-youtube-icon-*.png são, na verdade, JPEG com extensão .png;
  por isso o -s format png abaixo (transcodifica JPEG -> PNG). Gerados uma única vez, sem
  pipeline de build, com:
    sips -s format png -z 32 32   assets/nin-guem-youtube-icon-light.png --out assets/nin-guem-favicon-32-light.png
    sips -s format png -z 32 32   assets/nin-guem-youtube-icon-dark.png  --out assets/nin-guem-favicon-32-dark.png
    sips -s format png -z 180 180 assets/nin-guem-youtube-icon-light.png --out assets/nin-guem-apple-touch-180.png
  Ícones 192x192 e 512x512 para o PWA foram gerados a partir do apple-touch-180.png.
-->
<link rel="icon" type="image/png" id="favicon" sizes="32x32" href="assets/nin-guem-favicon-32-light.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/nin-guem-apple-touch-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/variaveis.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/css/telas.css">
<link rel="stylesheet" href="assets/css/animacoes.css">
</head>

<a class="skipLink" href="#app">Pular para o conteúdo</a>

<noscript><div class="card" style="padding:16px">Este jogo precisa de JavaScript ativado para funcionar.</div></noscript>

<div class="sr-only" id="ariaAnnounce" role="status" aria-live="polite"></div>

<div class="wrap">
  <header>
    <div class="topRow">
      <button class="homeBtn" id="home" data-action="intro" title="Voltar ao início [Esc]" aria-label="Voltar ao início" hidden>← início</button>
      <div class="logo">
        E aí, Bora Aprender AWS?
        <small>protótipo · por 人間/人间 (nin-guem) · livre (AGPL + CC BY-NC-SA 4.0)</small>
      </div>
      <div class="ctrlGroup" aria-live="polite" aria-atomic="true">
        <span id="netBadge" class="netBadge" aria-label="Status da rede"></span>
        <button class="iconBtn" id="btnInstall" data-action="install-pwa" title="Instalar app" aria-label="Instalar app" hidden>⬇</button>
        <button class="iconBtn" id="btnBackup" data-action="backup" title="Backup / restaurar dados" aria-label="Backup e restauração">💾</button>
        <button class="iconBtn" id="btnFontMinus" data-action="font-minus" title="Diminuir fonte" aria-label="Diminuir texto">A-</button>
        <button class="iconBtn" id="btnFontPlus" data-action="font-plus" title="Aumentar fonte" aria-label="Aumentar texto">A+</button>
        <button class="iconBtn" id="btnTheme" data-action="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema" aria-pressed="false">☀️</button>
        <button class="iconBtn" id="btnAudio" data-action="audio" title="Alternar som ligado/desligado" aria-label="Alternar som" aria-pressed="false">🔊</button>
        <button class="iconBtn" id="btnHelp" data-action="bem-vindo" title="Ajuda e boas-vindas" aria-label="Ajuda e boas-vindas">❓</button>
      </div>
    </div>
    <div class="statusBar">
      <div class="bar" role="progressbar" aria-label="Progresso do jogo" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <span class="streak" id="streak" title="Sequência diária de estudos">🔥 0d</span>
      <div class="xp" id="xp">0 XP</div>
    </div>
  </header>

  <main class="card" id="app" tabindex="-1"></main>

  <footer class="foot">do zero à aprovação · você é a Júlia <span aria-hidden="true">👩🏽‍💻</span></footer>
</div>

</html>
