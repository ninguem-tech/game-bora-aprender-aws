<!doctype html>
<html lang="pt-BR" data-text-scale="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E aí, Bora Aprender AWS? — Jogo de Estudos SAA-C03</title>
<style>
  :root {
    --creme: #f6efe3;
    --cafe: #3e2a20;
    --cafe2: #5a3d2e;
    --leite: #fffdf8;
    --linha: #e3d6c2;
    --dim: #8a7a68;
    --verde: #2e7d4f;
    --verde-bg: #e4f3ea;
    --vermelho: #b5462f;
    --vermelho-bg: #f7e6e0;
    --dourado: #c98a3c;
    --azul: #2b5d6b;
    --azul-bg: #e6eff2;
    --shadow: rgba(62,42,32,0.08);
    --focus-ring: #c98a3c;
    --font-scale: 1rem;
  }

  body.dark {
    --creme: #161412;
    --cafe: #f4eae0;
    --cafe2: #d6c4b2;
    --leite: #221c17;
    --linha: #3b3027;
    --dim: #a69485;
    --verde: #4ade80;
    --verde-bg: #143320;
    --vermelho: #f87171;
    --vermelho-bg: #3d1714;
    --dourado: #fbbf24;
    --azul: #38bdf8;
    --azul-bg: #112834;
    --shadow: rgba(0,0,0,0.3);
    --focus-ring: #fbbf24;
  }

  html[data-text-scale="0.85"] { font-size: 85%; }
  html[data-text-scale="1"] { font-size: 100%; }
  html[data-text-scale="1.15"] { font-size: 115%; }
  html[data-text-scale="1.3"] { font-size: 130%; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--creme); color: var(--cafe); font-family: -apple-system, Segoe UI, Roboto, Ubuntu, system-ui, sans-serif; line-height: 1.5; transition: background 0.25s, color 0.25s; }

  /* Focus visible accessibility ring */
  *:focus-visible {
    outline: 3px solid var(--focus-ring) !important;
    outline-offset: 2px !important;
    border-radius: 8px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }

  body {
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);
    display: flex; justify-content: center; min-height: 100vh;
  }

  .wrap { width: 100%; max-width: 600px; padding-top: 10px; display: flex; flex-direction: column; }

  /* Top Nav Header */
  header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .topRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo { font-weight: 800; font-size: 1.02rem; letter-spacing: .2px; color: var(--cafe); }
  .logo small { font-weight: 600; color: var(--dim); display: block; font-size: .66rem; letter-spacing: .3px; }

  .ctrlGroup { display: flex; align-items: center; gap: 6px; }
  .iconBtn {
    font: inherit; font-size: .85rem; font-weight: 700; color: var(--cafe2);
    background: var(--leite); border: 1px solid var(--linha); border-radius: 99px;
    padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s; min-height: 36px; min-width: 36px;
  }
  .iconBtn:hover { border-color: var(--dourado); background: var(--creme); }

  .statusBar { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 10px; background: var(--linha); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--dourado), var(--verde)); transition: width .4s ease-out; }
  .xp { font-weight: 800; font-size: .95rem; color: var(--cafe2); white-space: nowrap; }

  .homeBtn {
    font: inherit; font-weight: 700; font-size: .82rem; color: var(--cafe2); background: var(--leite);
    border: 1px solid var(--linha); border-radius: 99px; padding: 6px 14px; cursor: pointer; white-space: nowrap;
    transition: all .15s; min-height: 36px;
  }
  .homeBtn:hover { border-color: var(--dourado); }
  .homeBtn[hidden] { display: none; }

  /* Main Card Container */
  .card {
    background: var(--leite); border: 1px solid var(--linha); border-radius: 20px;
    padding: 22px; box-shadow: 0 8px 24px var(--shadow); transition: transform .25s, opacity .25s;
  }

  h1 { font-size: 1.5rem; margin: .1em 0 .3em; color: var(--cafe); line-height: 1.25; }
  .lead { color: var(--cafe2); font-size: 1rem; margin-bottom: 12px; }

  /* Persona badges */
  .who { display: inline-block; font-weight: 700; font-size: .78rem; padding: 3px 10px; border-radius: 99px; background: var(--linha); color: var(--cafe2); margin-bottom: 10px; }
  .who.rafael { background: #e7eef0; color: #2b4d57; }
  body.dark .who.rafael { background: #1a333d; color: #7dd3fc; }
  .who.camila { background: #f0e8f2; color: #5a3a63; }
  body.dark .who.camila { background: #38213e; color: #f0abfc; }
  .who.leitner { background: var(--azul-bg); color: var(--azul); }
  .who.pet { background: #fef3c7; color: #92400e; }
  body.dark .who.pet { background: #451a03; color: #fde68a; }

  .badge { float: right; font-weight: 800; font-size: .68rem; padding: 4px 10px; border-radius: 99px; letter-spacing: .3px; }
  .badge.base { background: var(--verde-bg); color: var(--verde); }
  .badge.prova { background: #efe6d6; color: #8a5a1e; }
  body.dark .badge.prova { background: #3d2b17; color: #fcd34d; }
  .badge.desafio { background: var(--vermelho-bg); color: var(--vermelho); }
  .badge.box { background: var(--azul-bg); color: var(--azul); }

  .situacao { background: var(--creme); border-left: 4px solid var(--dourado); padding: 12px 14px; border-radius: 10px; margin: 10px 0 16px; font-size: 1.02rem; }
  .dica { background: var(--verde-bg); border-left: 4px solid var(--verde); padding: 12px 14px; border-radius: 10px; margin: 10px 0; font-size: .97rem; }
  .dica b { color: var(--verde); }
  .resp { background: var(--azul-bg); border-left: 4px solid var(--azul); padding: 14px; border-radius: 10px; margin: 12px 0; font-size: 1rem; }
  .resp .ok { font-weight: 800; color: var(--verde); }

  .dicaBtn {
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: .9rem;
    color: var(--verde); background: var(--verde-bg); border: 1px solid var(--verde); border-radius: 99px;
    padding: 8px 16px; cursor: pointer; margin: 6px 0 14px; transition: opacity .15s;
  }
  .dicaBtn:disabled { opacity: .55; cursor: default; }

  .perg { font-weight: 700; font-size: 1.1rem; margin: 8px 0 14px; color: var(--cafe); }
  .opts { display: flex; flex-direction: column; gap: 10px; }

  button.opt {
    text-align: left; font: inherit; font-size: 1rem; color: var(--cafe);
    background: var(--leite); border: 2px solid var(--linha); border-radius: 14px;
    padding: 13px 16px; cursor: pointer; transition: border-color .15s, background .15s; min-height: 52px;
    display: flex; align-items: center; justify-content: space-between;

  button.opt:hover:not(:disabled) { border-color: var(--dourado); background: var(--creme); }
  button.opt:disabled { cursor: default; opacity: .95; }
  button.opt.ok { border-color: var(--verde); background: var(--verde-bg); font-weight: 600; }
  button.opt.no { border-color: var(--vermelho); background: var(--vermelho-bg); }
  
  .optKeyGroup { display: inline-flex; align-items: center; gap: 8px; margin-right: 10px; }
  .keyBadge {
    font-size: .75rem; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    background: var(--linha); color: var(--dim); font-family: monospace;
  }
  button.opt .k { font-weight: 800; color: var(--cafe2); }

  .fb { margin-top: 18px; padding: 16px; border-radius: 14px; font-size: .98rem; }
  .fb.ok { background: var(--verde-bg); border: 1px solid var(--verde); }
  .fb.no { background: var(--vermelho-bg); border: 1px solid var(--vermelho); }
  .fb .tag { font-weight: 800; display: block; margin-bottom: 6px; font-size: 1.05rem; }
  .fb.ok .tag { color: var(--verde); } .fb.no .tag { color: var(--vermelho); }
  .fb .pq { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--linha); }
  .conceito { font-size: .82rem; color: var(--dim); margin-top: 10px; }

  .cta {
    display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 18px;
    font: inherit; font-weight: 800; font-size: 1.05rem; color: #fff; background: var(--cafe);
    border: 0; border-radius: 14px; padding: 15px; cursor: pointer; min-height: 52px; transition: background .15s, transform .1s;
    text-decoration: none;
  }
  body.dark .cta { background: #3b2e26; color: #f4eae0; }
  .cta:hover:not(:disabled) { background: var(--cafe2); transform: translateY(-1px); }
  .cta.ghost { background: transparent; color: var(--cafe2); border: 2px solid var(--linha); }
  .cta.ghost:hover { border-color: var(--dourado); background: var(--creme); }
  .cta.lt { background: var(--azul); } .cta.lt:hover { background: #1e4550; }
  .cta:disabled { opacity: .5; cursor: default; transform: none; }
  .row2 { display: flex; gap: 10px; } .row2 .cta { flex: 1; }

  /* Mode Switcher Tabs */
  .modeTabs { display: flex; gap: 6px; margin: 14px 0 16px; overflow-x: auto; padding-bottom: 4px; }
  .tabBtn {
    font: inherit; font-size: .85rem; font-weight: 700; color: var(--dim); background: var(--creme);
    border: 1px solid var(--linha); border-radius: 99px; padding: 7px 14px; cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .tabBtn:hover { border-color: var(--dourado); color: var(--cafe); }
  .tabBtn.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }
  body.dark .tabBtn.active { background: var(--dourado); color: #161412; border-color: var(--dourado); }

  /* Search & Filter Bar */
  .searchWrap { margin-bottom: 14px; }
  .searchInput {
    width: 100%; font: inherit; font-size: .95rem; padding: 12px 16px; border: 2px solid var(--linha);
    border-radius: 12px; background: var(--creme); color: var(--cafe); transition: border-color .15s;
  }
  .searchInput:focus { border-color: var(--dourado); outline: none; }

  .filterChips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    font: inherit; font-size: .76rem; font-weight: 700; color: var(--dim); background: var(--creme);
    border: 1px solid var(--linha); border-radius: 99px; padding: 4px 10px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--dourado); }
  .chip.active { background: var(--dourado); color: #fff; border-color: var(--dourado); }
  body.dark .chip.active { color: #161412; }

  /* Phase List Buttons */
  .faseGrid { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .faseBtn {
    display: flex; align-items: center; justify-content: space-between; text-align: left; font: inherit; font-size: 1.02rem;
    font-weight: 700; color: var(--cafe); background: var(--creme); border: 2px solid var(--linha);
    border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .faseBtn:hover { border-color: var(--dourado); transform: translateY(-1px); }
  .faseBtn small { display: block; font-weight: 600; color: var(--dim); font-size: .78rem; margin-top: 2px; }
  .faseBadge { font-size: .75rem; font-weight: 800; padding: 4px 8px; border-radius: 99px; white-space: nowrap; }
  .faseBadge.done { background: var(--verde-bg); color: var(--verde); }
  .faseBadge.star { background: #fef3c7; color: #92400e; }

  /* Stats Summary Dashboard */
  .dashGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 16px; }
  .dashItem { background: var(--creme); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .dashItem b { display: block; font-size: 1.3rem; color: var(--cafe2); }
  .dashItem span { font-size: .72rem; color: var(--dim); font-weight: 600; }

  .ltBox { background: var(--azul-bg); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .ltBox .n { font-size: 1.7rem; font-weight: 800; color: var(--azul); min-width: 34px; text-align: center; }
  .ltBox .t { flex: 1; font-size: .9rem; color: var(--cafe2); }

  /* Pet Avatar Box */
  .petDisplay {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--creme); border: 2px dashed var(--dourado); border-radius: 16px; padding: 16px; margin: 12px 0; text-align: center;
  }
  .petIcon { font-size: 3.5rem; transition: transform .3s ease; display: inline-block; }
  .petBounce { animation: petBounce 1.2s infinite ease-in-out; }
  .petHappy { animation: petHappy 0.6s infinite alternate; }
  .petSad { animation: petSad 0.4s infinite alternate; }
  
  @keyframes petBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes petHappy { 0% { transform: scale(1) rotate(-5deg); } 100% { transform: scale(1.2) rotate(5deg); } }
  @keyframes petSad { 0% { transform: translateX(-4deg); } 100% { transform: translateX(4deg); } }

  .petGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
  .petCard {
    font: inherit; background: var(--creme); border: 2px solid var(--linha); border-radius: 12px;
    padding: 10px 4px; cursor: pointer; text-align: center; transition: all .15s;
  }
  .petCard:hover { border-color: var(--dourado); }
  .petCard.selected { border-color: var(--verde); background: var(--verde-bg); }
  .petCard .emoji { font-size: 1.8rem; display: block; }
  .petCard .pname { font-size: .75rem; font-weight: 700; color: var(--cafe); display: block; margin-top: 2px; }

  ul.rev { margin: 8px 0 0; padding-left: 18px; } ul.rev li { margin: 4px 0; }
  .stat { display: flex; gap: 10px; margin: 14px 0; }
  .stat > div { flex: 1; background: var(--creme); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.5rem; color: var(--cafe2); }
  .stat span { font-size: .74rem; color: var(--dim); }

  .foot { text-align: center; color: var(--dim); font-size: .72rem; margin-top: 16px; font-weight: 600; }
  .pop { animation: pop .3s ease-out; } @keyframes pop { 0% { transform: scale(.97); opacity: .8; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="sr-only" id="ariaAnnounce" aria-live="polite"></div>

<div class="wrap">
  <header>
    <div class="topRow">
      <button class="homeBtn" id="home" onclick="intro()" title="Voltar ao início [Esc]" aria-label="Voltar ao início" hidden>← início</button>
      <div class="logo">
        E aí, Bora Aprender AWS?
        <small>protótipo · por 人間/人间 (nin-guem) · livre (AGPL + CC-BY-SA)</small>
      </div>
      <div class="ctrlGroup">
        <button class="iconBtn" id="btnFontMinus" onclick="changeFontScale(-1)" title="Diminuir fonte [A-]" aria-label="Diminuir texto">A-</button>
        <button class="iconBtn" id="btnFontPlus" onclick="changeFontScale(1)" title="Aumentar fonte [A+]" aria-label="Aumentar texto">A+</button>
        <button class="iconBtn" id="btnTheme" onclick="toggleTheme()" title="Alternar tema claro/escuro" aria-label="Alternar tema">☀️</button>
        <button class="iconBtn" id="btnAudio" onclick="toggleAudio()" title="Alternar som ligado/desligado" aria-label="Alternar som">🔊</button>
      </div>
    </div>
    <div class="statusBar">
      <div class="bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <div class="xp" id="xp">0 XP</div>
    </div>
  </header>

  <main class="card" id="app" tabIndex="-1"></main>
  
  <footer class="foot">do zero à aprovação · você é a Júlia 👩🏽‍💻</footer>
</div>

<script src="src/jogo.js"></script>
<script src="data/bank.js"></script>
<script>
// ---- BANCO DE QUESTÕES & ATALHOS ----
const BANK = window.AWS_BANK || { fases: [] };
const DIFF = { intro: ["base", "badge base"], exam: ["prova", "badge prova"], challenge: ["desafio", "badge desafio"] };

const PETS = [
  { id: 'cat', name: 'Gatinho', emoji: '🐱', word: 'Mimi' },
  { id: 'dog', name: 'Cãozinho', emoji: '🐶', word: 'Bidu' },
  { id: 'capy', name: 'Capivara', emoji: '🦫', word: 'Capi' },
  { id: 'parrot', name: 'Papagaio', emoji: '🦜', word: 'Loro' },
  { id: 'fish', name: 'Peixinho', emoji: '🐟', word: 'Nemo' }
];

// Indexador rápido de questões
const QINDEX = {};
BANK.fases.forEach(f => f.questions.forEach(q => QINDEX[q.id] = { q, faseId: f.id }));

// ---- PERSISTÊNCIA LOCAL (localStorage) ----
const LS_KEY = "bora_aws_v2";
const DIA = 86400000;
const INTERVALOS = [0, 1, 3, 7, 14]; // Dias por caixa Leitner (1 a 5)

let store = carregar();

function carregar() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return {
      deck: parsed.deck || {},
      xpTotal: parsed.xpTotal || 0,
      theme: parsed.theme || "light",
      muted: parsed.muted || false,
      fontScale: parsed.fontScale || 1.0,
      phaseStats: parsed.phaseStats || {},
      stats: parsed.stats || { totalAnswered: 0, totalCorrect: 0, maxStreak: 0 }
    };
  } catch(e) {
    return { deck: {}, xpTotal: 0, theme: "light", muted: false, fontScale: 1.0, phaseStats: {}, stats: { totalAnswered: 0, totalCorrect: 0, maxStreak: 0 } };
  }
}

function salvar() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e) {}
}

function agora() { return Date.now(); }
function devidos() { return Object.values(store.deck).filter(c => c.due <= agora()); }

// ---- SINTETIZADOR DE ÁUDIO (Web Audio API) ----
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type) {
  if (store.muted) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'ok') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08); // E5
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16); // G5
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'no') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now); // A3
      osc.frequency.linearRampToValueAtTime(164.81, now + 0.18); // E3
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (type === 'fanfare') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      osc.frequency.setValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc.start(now);
      osc.stop(now + 0.55);
    }
  } catch(e) {}
}

// ---- ACESSIBILIDADE E TEMA ----
function applyTheme() {
  document.body.classList.toggle('dark', store.theme === 'dark');
  document.getElementById('btnTheme').textContent = store.theme === 'dark' ? '🌙' : '☀️';
}
function toggleTheme() {
  store.theme = store.theme === 'dark' ? 'light' : 'dark';
  salvar(); applyTheme();
}

function applyFontScale() {
  document.documentElement.setAttribute('data-text-scale', store.fontScale);
}
function changeFontScale(delta) {
  const scales = [0.85, 1.0, 1.15, 1.3];
  let idx = scales.indexOf(store.fontScale);
  if (idx === -1) idx = 1;
  idx = Math.max(0, Math.min(scales.length - 1, idx + delta));
  store.fontScale = scales[idx];
  salvar(); applyFontScale();
}

function toggleAudio() {
  store.muted = !store.muted;
  salvar();
  document.getElementById('btnAudio').textContent = store.muted ? '🔇' : '🔊';
}

function announce(msg) {
  const el = document.getElementById('ariaAnnounce');
  if (el) { el.textContent = msg; }
}

// ---- ATALHOS DE TECLADO ----
window.addEventListener('keydown', (e) => {
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
    return;
  }
  const key = e.key.toLowerCase();
  
  if (e.key === 'Escape') {
    intro();
    return;
  }

  if (['1','2','3','4','a','b','c','d'].includes(key)) {
    let optIdx = -1;
    if (['1','2','3','4'].includes(key)) optIdx = parseInt(key) - 1;
    else if (key === 'a') optIdx = 0;
    else if (key === 'b') optIdx = 1;
    else if (key === 'c') optIdx = 2;
    else if (key === 'd' && document.querySelectorAll('#opts .opt').length > 3) optIdx = 3;

    if (modoRevisao && modoRevisao.revelado) {
      if (key === '1' || key === 'a') avalia(false);
      else if (key === '2' || key === 'b') avalia(true);
      return;
    }

    if (optIdx >= 0) {
      const btns = document.querySelectorAll('#opts .opt');
      if (btns && btns[optIdx] && !btns[optIdx].disabled) {
        btns[optIdx].click();
      }
    }
  }

  if (key === 'd' || key === 'h') {
    const dicaBtn = document.getElementById('dicaBtn');
    if (dicaBtn && !dicaBtn.disabled) {
      dicaBtn.click();
    }
  }

  if (e.key === 'Enter' || e.key === ' ') {
    if (modoRevisao) {
      if (!modoRevisao.revelado) {
        const mbtn = document.getElementById('mostrarBtn');
        if (mbtn) mbtn.click();
      }
      return;
    }
    const ctaBtn = document.querySelector('#fb .cta, #app .cta');
    if (ctaBtn && !ctaBtn.disabled && ctaBtn.id !== 'mostrarBtn') {
      e.preventDefault();
      ctaBtn.click();
    }
  }
});

// ---- LEITNER & DECK ----
function corretaTexto(d) {
  const k = d.answers[0]; const o = d.options.find(o => o.key === k);
  return o ? o.text : "";
}

function addLeitner(d) {
  store.deck[d.id] = {
    id: d.id, faseId: (QINDEX[d.id] ? QINDEX[d.id].faseId : null), box: 1, due: agora(),
    situacao: d.situacao || "", stem: d.stem, correta: corretaTexto(d), porque: d.explanation || "",
    lapsos: (store.deck[d.id] ? store.deck[d.id].lapsos + 1 : 1)
  };
  salvar();
}

function agendar(card, acertou) {
  if (acertou) { card.box = Math.min(5, card.box + 1); }
  else { card.box = 1; card.lapsos = (card.lapsos || 0) + 1; }
  const dias = INTERVALOS[card.box - 1];
  card.due = agora() + (dias === 0 ? 8000 : dias * DIA);
  if (card.box >= 5) { delete store.deck[card.id]; }
  salvar();
}

function showHome(b) { elHome.hidden = !b; }

function setProgress(done, total) {
  elBar.style.width = Math.min(100, ((done || 0) / (total || 1)) * 100) + "%";
  elBar.parentElement.setAttribute('aria-valuenow', Math.round(((done || 0) / (total || 1)) * 100));
  elXp.textContent = (store.xpTotal || 0) + " XP";
}

function topico(d) {
  const x = QINDEX[d.id] ? QINDEX[d.id].q : d;
  return (x.domainLabel ? x.domainLabel + " · " : "") + (x.services && x.services.length ? x.services[0] : (x.sourceChapter ? "cap " + x.sourceChapter : "tópico"));
}

function getCategoriaFase(titulo) {
  const t = titulo.toLowerCase();
  if (t.includes("fundamentos") || t.includes("well-architected") || t.includes("global")) return "fundamentos";
  if (t.includes("computação") || t.includes("ec2") || t.includes("vpc") || t.includes("rede") || t.includes("conteineres")) return "computacao";
  if (t.includes("segurança") || t.includes("iam") || t.includes("kms") || t.includes("waf") || t.includes("compliance")) return "seguranca";
  if (t.includes("armazenamento") || t.includes("bancos") || t.includes("s3") || t.includes("ebs") || t.includes("efs")) return "dados";
  if (t.includes("simulado") || t.includes("rodada relâmpago") || t.includes("cenários")) return "simulados";
  return "avancado";
}

function shuffleArray(arr) {
  for (let idx = arr.length - 1; idx > 0; idx--) {
    const j = Math.floor(Math.random() * (idx + 1));
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
  }
  return arr;
}

function setCategoryFilter(cat) {
  categoryFilter = cat;
  renderFasesList(document.getElementById('modoContent'));
}

function updateFaseGrid() {
  const grid = document.getElementById('faseGrid');
  if (!grid) return;

  const filtered = BANK.fases.map((f, idx) => ({ f, idx })).filter(({ f }) => {
    const cat = getCategoriaFase(f.titulo);
    const matchesCat = (categoryFilter === 'todas' || categoryFilter === cat);
    const matchesSearch = !searchFilter || f.titulo.toLowerCase().includes(searchFilter) || f.questions.some(q => q.stem.toLowerCase().includes(searchFilter) || (q.services && q.services.some(s => s.toLowerCase().includes(searchFilter))));
    return matchesCat && matchesSearch;
  });

  if (!filtered.length) {
    grid.innerHTML = `<div class="dica">Nenhuma fase encontrada para "${searchFilter}". Tente outro termo de busca.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(({ f, idx }) => {
    const st = store.phaseStats[f.id];
    let badgeHtml = "";
    if (st) {
      if (st.bestPercent === 100) badgeHtml = `<span class="faseBadge star">★ 100%</span>`;
      else badgeHtml = `<span class="faseBadge done">✓ ${st.bestPercent}%</span>`;
    }
    return `
      <button class="faseBtn" onclick="startFase(${idx})">
        <div>
          ${f.titulo}
          <small>${f.questions.length} desafios • [Atalhos 1-4 no jogo]</small>
        </div>
        ${badgeHtml}
      </button>`;
  }).join('');
}

function startFase(idx) {
  modoJogo = 'fases';
  fase = BANK.fases[idx]; q = fase.questions.slice();
  i = 0; xp = 0; streak = 0; acertos = 0; revisar = []; respondida = false; mostra();

function mostra() {
  respondida = false; hintsShown = 0; showHome(true);
  const d = q[i]; const [dlabel, dcls] = DIFF[d.difficulty] || ["", ""];
  app.className = "card pop";

    <div id="fb"></div>`;

  renderOptionsAndHints(d);

function revelarDica() {
  const d = q[i]; if (hintsShown >= d.hints.length) return;
  const area = document.getElementById('dicaArea'); const btn = document.getElementById('dicaBtn');
  const div = document.createElement('div'); div.className = "dica"; div.innerHTML = d.hints[hintsShown];
  area.insertBefore(div, btn); hintsShown++;
  if (hintsShown >= d.hints.length) { btn.disabled = true; btn.textContent = "✓ Sem mais dicas"; }
  else { btn.textContent = `💡 Ver outra dica (${hintsShown + 1}/${d.hints.length}) [D]`; }
  announce("Dica revelada: " + d.hints[hintsShown - 1]);
}

function responde(key, btn) {
  if (respondida) return; respondida = true;
  const d = q[i]; const certo = d.answers.includes(key);
  
  store.stats.totalAnswered = (store.stats.totalAnswered || 0) + 1;
  if (certo) store.stats.totalCorrect = (store.stats.totalCorrect || 0) + 1;

  document.querySelectorAll('#opts .opt').forEach(b => {
    b.disabled = true;
    if (d.answers.includes(b.dataset.k)) b.classList.add('ok');
    if (b.dataset.k === key && !certo) b.classList.add('no');
  });

  const usouDica = hintsShown > 0;
  const db = document.getElementById('dicaBtn'); if (db) db.disabled = true;

  if (certo) {
    playSound('ok');
    acertos++; streak++;
    if (streak > (store.stats.maxStreak || 0)) store.stats.maxStreak = streak;
    const g = 10 + (streak >= 3 ? 5 : 0) + (usouDica ? 0 : 2);
    xp += g; store.xpTotal = (store.xpTotal || 0) + g; salvar();
    announce("Resposta correta!");
  } else {
    playSound('no');
    streak = 0; revisar.push(topico(d)); addLeitner(d);
    announce("Resposta incorreta.");
  }

  if (modoJogo === 'pet') {
    const avatar = document.getElementById('petAvatar');
    const stText = document.getElementById('petStatusText');
    if (certo) {
      petEstado.correct++;
      if (avatar) avatar.className = "petIcon petHappy";
      if (stText) stText.innerHTML = `<b>${petSelecionado.word} adorou!</b> 🎉 Resposta certíssima!`;
    } else {
      petEstado.wrong++;
      if (avatar) avatar.className = "petIcon petSad";
      if (stText) stText.innerHTML = `<b>Ops!</b> ${petSelecionado.word} ficou apreensivo. Erros: ${petEstado.wrong}/${petEstado.maxWrong}`;
    }

    if (petEstado.wrong >= petEstado.maxWrong) petEstado.status = 'lost';
    else if (petEstado.correct >= petEstado.goal) petEstado.status = 'saved';
  } else if (modoJogo === 'survival') {
    if (certo) survivalEstado.correct++;
    else survivalEstado.wrong++;
  }

  const fb = document.getElementById('fb');
  fb.className = "fb " + (certo ? "ok" : "no");
  const tag = certo ? ("✓ Mandou bem!" + (streak >= 3 ? " 🔥 sequência de " + streak : "") + (usouDica ? "" : " (+2 sem dica)"))
    : "✕ Quase — bora entender, sem estresse";
  const pqNao = (!certo && d.whyNots && d.whyNots[key]) ? `<div class="pq"><b>Por que essa não:</b> ${d.whyNots[key]}</div>` : "";
  
  fb.innerHTML = `<span class="tag">${tag}</span>${d.explanation || ""}${pqNao}
    <div class="conceito">${certo ? "" : "📒 Adicionado ao Leitner — volta pra você revisar e fixar."}</div>`;

  const last = (modoJogo === 'fases' && i === q.length - 1) || (modoJogo === 'pet' && petEstado.status !== 'ongoing') || (modoJogo === 'survival' && survivalEstado.wrong >= survivalEstado.maxWrong);
  
  const cta = document.createElement('button'); cta.className = "cta";
  cta.textContent = last ? "Ver resultado [Enter] →" : "Próximo desafio [Enter] →";
  cta.onclick = () => {
    i++;
    if (modoJogo === 'pet') {
      if (petEstado.status !== 'ongoing') resumoPet();
      else mostraPetPergunta();
    } else if (modoJogo === 'survival') {
      if (survivalEstado.wrong >= survivalEstado.maxWrong) resumoSurvival();
      else mostraSurvivalPergunta();
    } else {
      if (last) resumo();
      else mostra();
    }
  };
  fb.appendChild(cta);

  if (modoJogo === 'fases') setProgress(i + 1, q.length);
}

    <h1>${win ? `Você salvou ${petSelecionado.word}! 🎉` : `${petSelecionado.word} precisou fugir... 😿`}</h1>
    <div class="petDisplay">
      <span class="petIcon ${win?'petHappy':'petSad'}">${petSelecionado.emoji}</span>
      <p class="lead" style="margin-top:10px">${win ? `Com ${petEstado.correct} acertos, você provou que domina a AWS e garantiu a alegria do seu companheiro!` : `Você atingiu 3 erros. Mas não desanime, revise as questões no Leitner e tente novamente!`}</p>
    </div>
    <button class="cta" onclick="intro()">Voltar ao início [Esc]</button>`;
}

function resumoSurvival() {
  playSound('no');
  app.className = "card pop";
  app.innerHTML = `
    <span class="who">⚡ Fim da Sobrevivência</span>
    <h1>Rodada Finalizada!</h1>
    <div class="stat">
      <div><b>${survivalEstado.correct}</b><span>acertos consecutivos</span></div>
      <div><b>${store.stats.maxStreak}</b><span>maior sequência</span></div>
    </div>
    <p class="lead">Você perdeu suas 3 vidas. Cada erro é uma excelente oportunidade para aprender e fixar!</p>
    <button class="cta" onclick="intro()">Voltar ao início [Esc]</button>`;
}

// ---------- REVISÃO LEITNER ----------
function revisar0() {
  const cards = devidos();
  if (!cards.length) { intro(); return; }
  cards.sort((a, b) => (a.box - b.box) || (a.due - b.due));
  modoRevisao = { cards, idx: 0, acertosRev: 0, revelado: false };
  mostraCartao();
}

function mostraCartao() {
  const m = modoRevisao; const c = m.cards[m.idx]; m.revelado = false; showHome(true);
  app.className = "card pop";
  app.innerHTML = `
    <span class="badge box">caixa ${c.box}/5</span>
    <span class="who leitner">📒 Revisão (Leitner)</span>
    ${c.situacao ? `<div class="situacao">📌 ${c.situacao}</div>` : ""}
    <div class="perg">${c.stem}</div>
    <div id="resparea"></div>
    <button class="cta lt" id="mostrarBtn" onclick="revelaResp()">Mostrar resposta [Espaço / Enter]</button>
    <p class="conceito">Cartão ${m.idx + 1} de ${m.cards.length} · revise sozinho e seja honesto</p>`;
  setProgress(m.idx, m.cards.length);
}

function revelaResp() {
  const m = modoRevisao; const c = m.cards[m.idx]; m.revelado = true;
  document.getElementById('resparea').innerHTML =
    `<div class="resp"><span class="ok">✓ ${c.correta}</span><div style="margin-top:6px">${c.porque}</div></div>`;
  document.getElementById('mostrarBtn').outerHTML =
    `<div class="row2">
       <button class="cta" style="background:var(--vermelho)" onclick="avalia(false)">Ainda erro [Tecla 1]</button>
       <button class="cta" style="background:var(--verde)" onclick="avalia(true)">Acertei 👍 [Tecla 2]</button>
     </div>`;
}

function avalia(acertou) {
  const m = modoRevisao; const c = m.cards[m.idx];
  if (acertou) { playSound('ok'); m.acertosRev++; }
  else { playSound('no'); }
  agendar(c, acertou);
  m.idx++;
  if (m.idx >= m.cards.length) resumoRevisao();
  else mostraCartao();
}

function resumoRevisao() {
  playSound('fanfare');
  const m = modoRevisao; const total = m.cards.length; const due = devidos().length;
  app.className = "card pop";
  app.innerHTML = `
    <span class="who leitner">📒 Revisão (Leitner)</span>
    <h1>Revisão feita! ✅</h1>
    <p class="lead">${m.acertosRev === total ? "Você dominou os cartões de hoje. Repetição espaçada funcionando." : "Os que você ainda errou voltam logo; os que acertou voltam mais para a frente. É assim que fixa."}</p>
    <div class="stat">
      <div><b>${m.acertosRev}/${total}</b><span>acertos na revisão</span></div>
      <div><b>${due}</b><span>ainda pendentes</span></div>
    </div>
    ${due ? `<button class="cta lt" onclick="revisar0()">Continuar revisando (${due})</button>` : `<div class="dica">Tudo revisado por agora. Os cartões voltam no tempo certo. ☕</div>`}
    <button class="cta ghost" onclick="intro()">Voltar ao início [Esc]</button>`;
  setProgress(total, total); modoRevisao = null;
}

// ---------- SOBRE O AUTOR ----------
function sobre() {
  app.className = "card pop"; showHome(true);
  app.innerHTML = `
    <span class="who">人間 / 人间 · nin-guem</span>
    <h1>Sobre o nin-guem</h1>
    <p class="lead">Este é o pseudônimo que uso para escrever os meus livros e aplicativos. É um jogo de palavras.</p>
    <p><b>人間</b> (japonês / chinês tradicional) e <b>人间</b> (chinês simplificado) significam <b>"ser humano"</b> ou <b>"humanidade"</b>.</p>
    <p>Escolhi esse nome porque o foco aqui não sou eu — é o conhecimento compartilhado.</p>
    <p>A pronúncia lembra <b>"ninguém"</b> em português. E é exatamente essa a ideia.</p>
    <p>Se um dia perguntarem com quem você aprendeu AWS, espero que possa responder:</p>
    <div class="resp">
      <span class="ok">"Aprendi com nin-guem."</span>
      <div style="margin-top:6px">Porque o conhecimento agora é seu. Se você responder assim, minha missão está completa.</div>
    </div>
    <button class="cta" onclick="intro()">Bora estudar → [Esc]</button>`;
  setProgress(0, 1);
}

// Inicializar preferências e iniciar jogo
applyTheme();
applyFontScale();
if (store.muted) document.getElementById('btnAudio').textContent = '🔇';
intro();
</script>
</body>
</html>
