<!doctype html>
<html lang="pt-BR" data-text-scale="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- id="metaTema": acessibilidade.js sincroniza a cor com o tema ativo
     (claro/escuro) em vez de deixar um valor fixo pra sempre. -->
<meta name="theme-color" id="metaTema" content="#f6efe3">
<meta name="description" content="Jogo de estudos gratuito e amigável para a certificação AWS SAA-C03, com fases, modos Pet e Sobrevivência, e revisão Leitner.">
<!-- frame-ancestors só funciona como header HTTP; via <meta> é ignorado. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>E aí, Bora Aprender AWS? — Jogo de Estudos SAA-C03</title>
<!--
  Ícones da aba e apple-touch: derivados leves (PNG de verdade) da assinatura em assets/.
  Obs.: os originais nin-guem-youtube-icon-*.png são, na verdade, JPEG com extensão .png;
  por isso o -s format png abaixo (transcodifica JPEG -> PNG). Gerados uma única vez, sem
  pipeline de build, com:
    sips -s format png -z 32 32   assets/nin-guem-youtube-icon-light.png --out assets/nin-guem-favicon-32-light.png
    sips -s format png -z 32 32   assets/nin-guem-youtube-icon-dark.png  --out assets/nin-guem-favicon-32-dark.png
    sips -s format png -z 180 180 assets/nin-guem-youtube-icon-light.png --out assets/nin-guem-apple-touch-180.png
  Ícones 192x192 e 512x512 para o PWA foram gerados a partir do apple-touch-180.png.
-->
<link rel="icon" type="image/png" id="favicon" sizes="32x32" href="assets/nin-guem-favicon-32-light.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/nin-guem-apple-touch-180.png">
<link rel="stylesheet" href="assets/css/fontes.css">
<link rel="stylesheet" href="assets/css/variaveis.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/css/telas.css">
<link rel="stylesheet" href="assets/css/animacoes.css">
<!-- Scripts com defer: baixam em paralelo com o parse do HTML e executam em
     ordem só depois que o documento inteiro foi parseado. Assim o primeiro
     render (cabeçalho e cartão) não fica bloqueado pelo download e parsing
     de data/bank.js (~1MB), o maior arquivo do jogo. A ordem entre os
     scripts continua garantida pelo defer. -->
<script src="src/pwa.js" defer></script>
<script src="src/jogo.js" defer></script>
<script src="data/bank.js" defer></script>
<script src="src/sha256.js" defer></script>
<script src="src/persistencia.js" defer></script>
<script src="src/audio.js" defer></script>
<script src="src/acessibilidade.js" defer></script>
<script src="src/renderizador-nucleo.js" defer></script>
<script src="src/renderizador-quiz.js" defer></script>
<script src="src/renderizador-home.js" defer></script>
<script src="src/renderizador-fases.js" defer></script>
<script src="src/renderizador-pet.js" defer></script>
<script src="src/renderizador-sobrevivencia.js" defer></script>
<script src="src/renderizador-simulado.js" defer></script>
<script src="src/renderizador-leitner.js" defer></script>
<script src="src/renderizador.js" defer></script>
<script src="src/teclado.js" defer></script>
<script src="src/sw-register.js" defer></script>
<script src="src/app.js" defer></script>
</head>
<body>

<a class="skipLink" href="#app">Pular para o conteúdo</a>

<noscript><div class="card">Este jogo precisa de JavaScript ativado para funcionar.</div></noscript>

<div class="sr-only" id="ariaAnnounce" role="status" aria-live="polite"></div>

<div class="wrap">
  <header>
    <div class="topRow">
      <button class="homeBtn" id="home" data-action="intro" title="Voltar ao início [Esc]" aria-label="Voltar ao início" hidden>← início</button>
      <div class="logo">
        E aí, Bora Aprender AWS?
        <small>protótipo · por 人間/人间 (nin-guem) · livre (AGPL + CC BY-NC-SA 4.0)</small>
      </div>
      <div class="ctrlGroup" aria-live="polite" aria-atomic="true">
        <span id="netBadge" class="netBadge" aria-label="Status da rede"></span>
        <button class="iconBtn" id="btnInstall" title="Instalar app" aria-label="Instalar app" hidden>⬇</button>
        <button class="iconBtn" id="btnBackup" data-action="backup" title="Backup / restaurar dados" aria-label="Backup e restauração">💾</button>
        <button class="iconBtn" id="btnFontMinus" data-action="font-minus" title="Diminuir fonte" aria-label="Diminuir texto">A-</button>
        <button class="iconBtn" id="btnFontPlus" data-action="font-plus" title="Aumentar fonte" aria-label="Aumentar texto">A+</button>
        <button class="iconBtn" id="btnTheme" data-action="theme" title="Alternar tema (claro, escuro ou automático)" aria-label="Alternar tema" aria-pressed="false">🌓</button>
        <button class="iconBtn" id="btnAudio" data-action="audio" title="Alternar som ligado/desligado" aria-label="Alternar som" aria-pressed="false">🔊</button>
        <button class="iconBtn" id="btnHelp" data-action="bem-vindo" title="Ajuda e boas-vindas" aria-label="Ajuda e boas-vindas">❓</button>
      </div>
    </div>
    <div class="statusBar">
      <div class="bar" role="progressbar" aria-label="Progresso do jogo" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <span class="streak" id="streak" title="Sequência diária de estudos">🔥 0d</span>
      <div class="xp" id="xp">0 XP</div>
    </div>
  </header>

  <main class="card" id="app" tabindex="-1"></main>

  <footer class="foot">do zero à aprovação · você ajudará a Júlia <span aria-hidden="true">👩🏽‍💻</span></footer>
</div>

</body>
</html>
